<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vagas - Flashwork (Acessível)</title>
<style>
/* Destaque de foco para navegação por teclado */
*:focus-visible {
  outline: 3px solid #f39c12 !important;
  outline-offset: 3px;
}

/* Link de atalho para saltar o menu */
.skip-link {
  position: absolute;
  top: -50px;
  left: 10px;
  background: #6a3a8e;
  color: #ffffff;
  padding: 10px 15px;
  z-index: 10000;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  transition: top 0.2s;
}
.skip-link:focus {
  top: 10px;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f4fa;
  color: #222222;
  line-height: 1.5;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #6a3a8e;
  padding: 12px 30px;
}
.nav-left {
  color: #ffffff;
  font-weight: bold;
  font-size: 1.2em;
}
.nav-links {
  display: flex;
  gap: 20px;
}
.nav-links a {
  color: #ffffff;
  text-decoration: none;
  font-weight: 500;
}
.nav-links a:hover, .nav-links a:focus {
  text-decoration: underline;
}

.container {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

/* FILTROS */
.sidebar {
  background: #ffffff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}
.sidebar h2 {
  margin-top: 0;
  font-size: 1.2em;
  color: #6a3a8e;
}
.filter {
  margin-bottom: 15px;
}
.filter label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  font-size: 14px;
}
.filter input[type="text"], .filter select {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #767676;
  box-sizing: border-box;
}
.filter-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-weight: bold;
  color: #6a3a8e;
  padding: 8px;
  background: #fbf3fb;
  border-radius: 6px;
}

/* LISTA DE VAGAS */
.jobs {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.job-card {
  background: #ffffff;
  padding: 22px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  transition: transform 0.2s, box-shadow 0.2s;
  border-left: 5px solid #6a3a8e;
}
.job-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}
.job-title {
  font-size: 22px;
  font-weight: bold;
  color: #6a3a8e;
  margin-top: 0;
  margin-bottom: 8px;
}
.job-info {
  font-size: 15px;
  margin: 6px 0;
  color: #333333;
}
.job-details {
  background: #fcf8ff;
  padding: 12px 15px;
  border-radius: 8px;
  margin: 12px 0;
  font-size: 14px;
  color: #444444;
}
.job-details p {
  margin: 4px 0;
}

/* BADGE PCD */
.badge-pcd {
  display: inline-block;
  background-color: #005a9c;
  color: #ffffff;
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: bold;
  margin-top: 4px;
}

.job-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 15px;
}
.btn {
  background: #6a3a8e;
  color: #ffffff;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  text-decoration: none;
  display: inline-block;
}
.btn:hover, .btn:focus {
  background: #522c70;
}

/* PAGINAÇÃO */
.pagination {
  display: flex;
  justify-content: center;
  margin-top: 25px;
  gap: 10px;
}
.page-btn {
  padding: 10px 15px;
  border: 1px solid #6a3a8e;
  background: #ffffff;
  color: #6a3a8e;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}
.page-btn.active {
  background: #6a3a8e;
  color: #ffffff;
}

@media(max-width: 800px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

<nav aria-label="Navegação Principal">
  <div class="nav-left">Flashwork</div>
  <div class="nav-links">
    <a href="index.html">Início</a>
  </div>
</nav>

<main id="conteudo-principal" class="container" tabindex="-1">

  <!-- FILTROS DE BUSCA -->
  <aside class="sidebar" aria-labelledby="titulo-filtros">
    <h2 id="titulo-filtros">Filtros de Busca</h2>

    <div class="filter">
      <label for="search">Buscar vaga por palavra-chave</label>
      <input type="text" id="search" placeholder="Ex: Designer, Desenvolvedor...">
    </div>

    <div class="filter">
      <label for="area">Área de Atuação</label>
      <select id="area">
        <option value="">Todas as Áreas</option>
        <option>TI</option>
        <option>Serviços Gerais</option>
        <option>Design</option>
        <option>Administrativo</option>
        <option>Marketing</option>
        <option>Outros</option>
      </select>
    </div>

    <div class="filter">
      <label for="tipo">Tipo de Contrato</label>
      <select id="tipo">
        <option value="">Todos os Tipos</option>
        <option>CLT</option>
        <option>Freelancer</option>
      </select>
    </div>

    <div class="filter">
      <label class="filter-checkbox" for="pcdOnly">
        <input type="checkbox" id="pcdOnly">
        <span>♿ Apenas Vagas para PcD</span>
      </label>
    </div>

    <button class="btn" style="width:100%" onclick="filtrar()" aria-label="Aplicar os filtros selecionados">Aplicar Filtros</button>
  </aside>

  <!-- LISTA DE VAGAS -->
  <section aria-labelledby="titulo-lista">
    <h1 id="titulo-lista" style="font-size:1.5em; color:#6a3a8e; margin-top:0;">Vagas Disponíveis</h1>
    <div class="jobs" id="jobs" role="region" aria-live="polite"></div>
    <nav class="pagination" id="pagination" aria-label="Paginação de vagas"></nav>
  </section>

</main>

<!-- Widget VLibras -->
<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<script>
  // Lista fixa com as 10 vagas variadas
  const todasVagas = [
    {
      titulo: "Assistente de R&S",
      empresa: "Hire Now®",
      area: "Administrativo",
      tipo: "Freelancer",
      salario: "R$ 1.800,00 por projeto",
      cargaHoraria: "20h semanais (Horário Flexível)",
      descricao: "Triagem de currículos, agendamento de entrevistas e apoio na condução de processos seletivos.",
      pcd: true
    },
    {
      titulo: "Designer de Landing Pages",
      empresa: "Agência Strategic LTDA",
      area: "Design",
      tipo: "Freelancer",
      salario: "R$ 2.500,00 por demanda",
      cargaHoraria: "Projeto Pontual (Prazo de 15 dias)",
      descricao: "Criação de layouts responsivos no Figma e montagem de páginas focadas em conversão.",
      pcd: false
    },
    {
      titulo: "Especialista em Suporte TI",
      empresa: "Gi Group SpA",
      area: "TI",
      tipo: "CLT",
      salario: "R$ 3.800,00 / mês + Benefícios",
      cargaHoraria: "44h semanais (Escala 5x2)",
      descricao: "Atendimento a chamados técnicos, manutenção de rede local e suporte a usuários internos.",
      pcd: true
    },
    {
      titulo: "Desenvolvedor Front-end React",
      empresa: "TechVerse Soluções",
      area: "TI",
      tipo: "Freelancer",
      salario: "R$ 4.500,00 / mês",
      cargaHoraria: "30h semanais (Remoto)",
      descricao: "Desenvolvimento de componentes reutilizáveis e integração de APIs REST com Reactjs.",
      pcd: false
    },
    {
      titulo: "Auxiliar Administrativo Financeiro",
      empresa: "Grupo Inova RH",
      area: "Administrativo",
      tipo: "CLT",
      salario: "R$ 2.200,00 / mês",
      cargaHoraria: "40h semanais (Segunda a Sexta)",
      descricao: "Lançamento de contas a pagar/receber, emissão de notas fiscais e conciliação bancária.",
      pcd: true
    },
    {
      titulo: "Redator de Conteúdo & Copywriter",
      empresa: "Agência Digital Spark",
      area: "Marketing",
      tipo: "Freelancer",
      salario: "R$ 1.500,00 / pacote mensal",
      cargaHoraria: "Flexível (Entrega quinzenal)",
      descricao: "Produção de artigos para blog orientados a SEO e textos persuasivos para anúncios digitais.",
      pcd: false
    },
    {
      titulo: "Atendente de Suporte ao Cliente",
      empresa: "Connect Call Center",
      area: "Outros",
      tipo: "CLT",
      salario: "R$ 1.620,00 + Comissões",
      cargaHoraria: "36h semanais (Escala 6x1)",
      descricao: "Atendimento via chat e telefone para resolução de dúvidas e suporte operacional aos clientes.",
      pcd: true
    },
    {
      titulo: "Designer Gráfico para Redes Sociais",
      empresa: "Studio Criativo",
      area: "Design",
      tipo: "Freelancer",
      salario: "R$ 1.200,00 / pacote de artes",
      cargaHoraria: "Flexível",
      descricao: "Criação de identidade visual, posts para Instagram e materiais publicitários digitais.",
      pcd: false
    },
    {
      titulo: "Analista de Marketing Digital / SEO",
      empresa: "Growth Media",
      area: "Marketing",
      tipo: "CLT",
      salario: "R$ 4.000,00 / mês",
      cargaHoraria: "40h semanais (Híbrido)",
      descricao: "Gestão de campanhas de tráfego pago (Google/Meta Ads), auditoria SEO e análise de métricas.",
      pcd: false
    },
    {
      titulo: "Ajudante Operacional / Serviços Gerais",
      empresa: "LogiExpress Logística",
      area: "Serviços Gerais",
      tipo: "CLT",
      salario: "R$ 1.950,00 + Vale Alimentação",
      cargaHoraria: "44h semanais",
      descricao: "Organização do estoque, separação de mercadorias para envio e conferência de materiais.",
      pcd: true
    }
  ];

  let vagasFiltradas = [...todasVagas];
  let pagina = 1;
  const porPagina = 5;

  function render(){
    const lista = document.getElementById('jobs');
    lista.innerHTML = '';

    if(vagasFiltradas.length === 0){
      lista.innerHTML = '<p style="text-align:center; padding:30px; font-size:1.1em;">Nenhuma vaga encontrada com os filtros selecionados.</p>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    const inicio = (pagina - 1) * porPagina;
    const fim = inicio + porPagina;

    vagasFiltradas.slice(inicio, fim).forEach(vaga => {
      const badgePcd = vaga.pcd ? `<div class="badge-pcd" aria-label="Vaga afirmativa ou exclusiva para Pessoa com Deficiência">♿ Vaga para PcD</div>` : '';

      lista.innerHTML += `
      <article class="job-card">
        <h2 class="job-title">${vaga.titulo}</h2>
        <div class="job-info">🏢 <strong>Empresa:</strong> ${vaga.empresa} • <strong>Área:</strong> ${vaga.area} • <strong>Tipo:</strong> ${vaga.tipo}</div>
        
        <div class="job-details">
          <p>💰 <strong>Salário:</strong> ${vaga.salario}</p>
          <p>⏰ <strong>Carga Horária:</strong> ${vaga.cargaHoraria}</p>
          <p>📝 <strong>O que vai fazer:</strong> ${vaga.descricao}</p>
        </div>

        ${badgePcd}
        <div class="job-actions">
          <a href="candidatura.html?vaga=${encodeURIComponent(vaga.titulo)}" class="btn" aria-label="Candidatar-se para a vaga ${vaga.titulo}">Enviar CV / Candidatar-se</a>
        </div>
      </article>`;
    });

    renderPagination();
  }

  function renderPagination(){
    const total = Math.ceil(vagasFiltradas.length / porPagina);
    const pag = document.getElementById('pagination');
    pag.innerHTML = '';

    if (total <= 1) return;

    for(let i = 1; i <= total; i++){
      pag.innerHTML += `<button class="page-btn ${i === pagina ? 'active' : ''}" onclick="mudarPagina(${i})" aria-label="Ir para a página ${i}">${i}</button>`;
    }
  }

  function mudarPagina(p){
    pagina = p;
    render();
  }

  function filtrar(){
    const busca = document.getElementById('search').value.toLowerCase();
    const area = document.getElementById('area').value;
    const tipo = document.getElementById('tipo').value;
    const apenasPcd = document.getElementById('pcdOnly').checked;

    vagasFiltradas = todasVagas.filter(v => {
      const matchBusca = v.titulo.toLowerCase().includes(busca) || v.empresa.toLowerCase().includes(busca);
      const matchArea = !area || v.area === area;
      const matchTipo = !tipo || v.tipo === tipo;
      const matchPcd = !apenasPcd || v.pcd === true;

      return matchBusca && matchArea && matchTipo && matchPcd;
    });

    pagina = 1;
    render();
  }

  // Renderiza imediatamente ao carregar
  render();
</script>

</body>
</html>
