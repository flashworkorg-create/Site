<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidatura - Flashwork</title>
    <link rel="stylesheet" href="/candidatura/candidatura.css" />
  </head>
  <body>
    <a href="#conteudo-principal" class="skip-link"
      >Pular para o formulário de candidatura</a
    >

    <nav aria-label="Navegação Superior">
      <div class="nav-left">Flashwork</div>
      <button
        class="nav-btn"
        onclick="history.back()"
        aria-label="Voltar para a página de vagas"
      >
        ← Voltar para Vagas
      </button>
    </nav>

    <main id="conteudo-principal" class="container" tabindex="-1">
      <h1>Enviar Currículo</h1>

      <div class="vaga-destaque" id="vaga-titulo-display">
        Candidatando-se para: <span id="nome-vaga">Vaga Geral</span>
      </div>

      <!-- CAIXA DE CONFIRMAÇÃO DE ENVIO DE CURRÍCULO -->
      <div
        id="box-sucesso"
        class="mensagem-sucesso"
        role="alert"
        aria-live="polite"
      >
        ✅ Currículo enviado com sucesso!
        <p
          style="
            font-size: 15px;
            font-weight: normal;
            margin-top: 10px;
            color: #333;
          "
        >
          A equipe de recrutamento analisará suas informações e entrará em
          contato em breve.
        </p>
        <button
          class="btn-enviar"
          style="width: auto; padding: 10px 20px"
          onclick="window.location.href = '/vagas/vagas.html'"
        >
          Voltar para a Lista de Vagas
        </button>
      </div>

      <!-- FORMULÁRIO -->
      <form
        id="form-candidatura"
        onsubmit="
          event.preventDefault();
          enviarCandidatura();
        "
      >
        <div class="form-group">
          <label for="nome">Nome Completo *</label>
          <input
            type="text"
            id="nome"
            required
            placeholder="Digite seu nome completo"
          />
        </div>

        <div class="form-group">
          <label for="email">E-mail de Contato *</label>
          <input
            type="email"
            id="email"
            required
            placeholder="seuemail@exemplo.com"
          />
        </div>

        <div class="form-group">
          <label for="telefone">Telefone / WhatsApp *</label>
          <input
            type="tel"
            id="telefone"
            required
            placeholder="(11) 99999-9999"
          />
        </div>

        <div class="form-group">
          <label for="escolaridade">Escolaridade *</label>
          <select id="escolaridade" required>
            <option value="">Selecione sua escolaridade</option>
            <option>Ensino Fundamental</option>
            <option>Ensino Médio Incompleto</option>
            <option>Ensino Médio Completo</option>
            <option>Ensino Técnico</option>
            <option>Superior Incompleto</option>
            <option>Superior Completo</option>
            <option>Pós-Graduação / Especialização</option>
          </select>
        </div>

        <div class="form-group">
          <label for="experiencia">Resumo das Experiências Anteriores *</label>
          <textarea
            id="experiencia"
            rows="4"
            required
            placeholder="Descreva brevemente onde já trabalhou e suas principais funções..."
          ></textarea>
        </div>

        <div class="form-group">
          <label for="curriculo">Anexar Currículo (PDF ou DOCX) *</label>
          <input
            type="file"
            id="curriculo"
            accept=".pdf, .doc, .docx"
            required
            aria-label="Upload de ficheiro do currículo"
          />
        </div>

        <button
          type="submit"
          class="btn-enviar"
          aria-label="Enviar candidatura e currículo"
        >
          Enviar Candidatura
        </button>
      </form>
    </main>

    <!-- Widget VLibras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
  </body>
  <script src="candidatura.js"></script>
</html>
