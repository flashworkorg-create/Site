<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Conta Freelancer - Flashwork</title>
<style>
body{margin:0;font-family:Arial;background:#fbf3fb;color:#333}
nav{display:flex;justify-content:space-between;align-items:center;background:#7e4aa3;padding:12px 30px}
.nav-left{color:#fff;font-weight:bold}
.nav-btn{background:#fff;color:#9562b8;border:none;padding:8px 14px;border-radius:6px;cursor:pointer}
.container{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.left{background:linear-gradient(135deg,#9562b8,#7e4aa3);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px}
.left h1{font-size:2.5em}
.right{display:flex;align-items:center;justify-content:center}
.form-box{background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:100%;max-width:520px}
.progress{height:6px;background:#eee;border-radius:10px;margin-bottom:20px;overflow:hidden}
.progress-bar{height:100%;width:50%;background:#9562b8;transition:.3s}
.form-step{display:none}
.form-step.active{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/3}
label{font-size:12px;color:#777}
.input, select, textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:5px}
.btn{width:100%;background:#9562b8;color:#fff;border:none;padding:14px;border-radius:10px;cursor:pointer;margin-top:20px}
.btn:hover{background:#7e4aa3}
@media(max-width:800px){.container{grid-template-columns:1fr}.left{display:none}.form-grid{grid-template-columns:1fr}.full{grid-column:1}}
</style>
</head>
<body>

<nav>
<div class="nav-left">Flashwork</div>
<button class="nav-btn" onclick="history.back()">← Voltar</button>
</nav>

<div class="container">

<div class="left">
<h1>Comece a ganhar hoje</h1>
<p>Crie seu perfil e encontre trabalhos rapidamente</p>
</div>

<div class="right">
<div class="form-box">
<h2>Crie seu perfil</h2>
<div class="progress"><div class="progress-bar" id="progress"></div></div>

<!-- ETAPA 1 -->
<div class="form-step active" id="step1">
<div class="form-grid">
<div class="full">
<label>Email</label>
<input class="input" id="email" type="email" required>
</div>
<div>
<label>Nome</label>
<input class="input" id="nome" type="text" required>
</div>
<div>
<label>Sobrenome</label>
<input class="input" id="sobrenome" type="text" required>
</div>
<div>
<label>Celular</label>
<input class="input" id="celular" type="text" required>
</div>
</div>
<button class="btn" onclick="nextStep()">Continuar</button>
</div>

<!-- ETAPA 2 -->
<div class="form-step" id="step2">
<div class="form-grid">
<div>
<label>Área</label>
<select id="area" required>
<option value="">Selecione</option>
<option>Design</option>
<option>Programação</option>
<option>Marketing</option>
<option>Atendimento</option>
</select>
</div>
<div class="full">
<label>Sobre você</label>
<textarea id="descricao" required></textarea>
</div>
<div class="full">
<label>Senha</label>
<input class="input" id="senha" type="password" required>
</div>
</div>
<button class="btn" onclick="criarConta()">Criar conta</button>
</div>

</div>
</div>

</div>

<script>
function nextStep(){
 const inputs = document.querySelectorAll('#step1 input');
 for(let input of inputs){
   if(!input.checkValidity() || input.value.trim()===''){
     alert('Preencha todos os campos!');
     return;
   }
 }

 document.getElementById('step1').classList.remove('active');
 document.getElementById('step2').classList.add('active');
 document.getElementById('progress').style.width='100%';
}

function criarConta(){
 const inputs = document.querySelectorAll('#step2 input, #step2 textarea, #step2 select');
 for(let input of inputs){
   if(!input.checkValidity() || input.value.trim()===''){
     alert('Preencha todos os campos!');
     return;
   }
 }

 const celular = document.getElementById('celular').value;
 if(!/^\\d+$/.test(celular)){
   alert('Celular deve conter apenas números');
   return;
 }

 alert('Conta criada com sucesso!');
 window.location.href='index.html';
}
</script>

</body>
</html>
