<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Flashwork</title>
<style>
/* Destaque visual de foco para navegação por teclado */
*:focus-visible {
  outline: 3px solid #f39c12 !important;
  outline-offset: 3px;
}

/* Link de atalho para saltar direto para o formulário */
.skip-link {
  position: absolute;
  top: -50px;
  left: 10px;
  background: #6a3a8e;
  color: #ffffff;
  padding: 10px 15px;
  z-index: 10000;
  border-radius: 6px;
  text-decoration: none;
  font-weight: bold;
  transition: top 0.2s;
}
.skip-link:focus {
  top: 10px;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f4fa;
  color: #222222;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  line-height: 1.5;
}

.login-container {
  max-width: 400px;
  width: 90%;
  padding: 40px;
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  text-align: center;
}

h1 {
  color: #6a3a8e;
  font-size: 1.8em;
  margin-top: 0;
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 20px;
  text-align: left;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: bold;
  color: #444444;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #767676;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 16px;
}

.btn {
  width: 100%;
  background: #6a3a8e;
  color: #ffffff;
  border: none;
  padding: 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  margin-top: 10px;
  transition: background 0.2s;
}

.btn:hover, .btn:focus {
  background: #522c70;
}

.back-link {
  margin-top: 25px;
  font-size: 14px;
}

.back-link a {
  color: #6a3a8e;
  text-decoration: none;
  font-weight: bold;
}

.back-link a:hover, .back-link a:focus {
  text-decoration: underline;
}
</style>
</head>
<body>

<!-- Atalho de Acessibilidade -->
<a href="#conteudo-principal" class="skip-link">Pular para o formulário de login</a>

<main id="conteudo-principal" class="login-container" tabindex="-1">
  <h1>Acessar Flashwork</h1>
  
  <form onsubmit="event.preventDefault(); handleLogin();">
    <div class="form-group">
      <label for="username">Usuário *</label>
      <input type="text" id="username" required placeholder="Digite o seu usuário">
    </div>

    <div class="form-group">
      <label for="password">Senha *</label>
      <input type="password" id="password" required placeholder="Digite a sua senha">
    </div>

    <button type="submit" class="btn" aria-label="Entrar no painel da Flashwork">Entrar</button>
  </form>

  <div class="back-link">
    <a href="index.html" aria-label="Voltar para a página inicial">← Voltar para o Início</a>
  </div>
</main>

<!-- Widget VLibras (Acessibilidade para Surdos e Deficientes Auditivos) -->
<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<script>
  function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      alert('Por favor, preencha todos os campos obrigatórios.');
      return;
    }

    // Credenciais de exemplo para administração
    if (username === 'admin' && password === 'w0rK') {
      sessionStorage.setItem('flashwork_admin_auth', 'true');
      window.location.href = 'admin.html';
    } else {
      alert('Usuário ou senha incorretos!');
    }
  }
</script>

</body>
</html>
