<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Conta Empresa - Flashwork</title>
    <link rel="stylesheet" href="loginempresa.css" />
  </head>
  <body>
    <a href="#conteudo-principal" class="skip-link">Pular para o formulário</a>

    <nav aria-label="Navegação Principal">
      <div class="nav-left">Flashwork</div>
      <button
        class="nav-btn"
        onclick="history.back()"
        aria-label="Voltar para a página anterior"
      >
        ← Voltar
      </button>
    </nav>

    <main id="conteudo-principal" class="container" tabindex="-1">
      <div class="left">
        <h1>Crie sua conta empresa</h1>
        <p>
          Sem burocracia. Contrate profissionais qualificados de forma rápida.
        </p>
      </div>

      <div class="right">
        <form
          class="form-box"
          onsubmit="
            event.preventDefault();
            criarConta();
          "
        >
          <h2>Cadastro de Empresa</h2>

          <div class="form-grid">
            <div class="full">
              <label for="email">E-mail corporativo</label>
              <input id="email" type="email" required />
            </div>
            <div>
              <label for="nome">Nome do responsável</label>
              <input id="nome" type="text" required />
            </div>
            <div>
              <label for="empresa">Nome da Empresa</label>
              <input id="empresa" type="text" required />
            </div>
            <div>
              <label for="celular">Celular</label>
              <input
                id="celular"
                type="tel"
                pattern="[0-9]+"
                required
                placeholder="Apenas números"
              />
            </div>
            <div>
              <label for="cnpj">CNPJ</label>
              <input
                id="cnpj"
                type="text"
                required
                placeholder="Apenas números"
              />
            </div>
          </div>

          <button type="submit" class="btn">Criar Conta Empresa</button>
        </form>
      </div>
    </main>

    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
    </div>

     <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
  </body>
  <script src="loginempresa.js"></script>
</html>
