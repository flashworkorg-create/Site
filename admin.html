<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Gerenciar Vagas</title>
<style>
*:focus-visible { outline: 3px solid #f39c12 !important; outline-offset: 3px; }
body{margin:0;font-family:Arial,sans-serif;background:#f7f4fa;color:#222;line-height:1.5}
nav{background:#6a3a8e;padding:15px 30px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.container{max-width:900px;margin:30px auto;padding:20px;background:#fff;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,0.08)}
h1, h2{color:#6a3a8e}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:5px;font-size:14px;font-weight:bold}
input, select{width:100%;padding:10px;border:1px solid #767676;border-radius:6px;box-sizing:border-box}
.btn{background:#6a3a8e;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:bold}
.btn-danger{background:#d9534f}
table{width:100%;border-collapse:collapse;margin-top:30px}
th, td{text-align:left;padding:12px;border-bottom:1px solid #eee}
th{background:#f9f9f9;color:#6a3a8e}
#login-container { max-width: 400px; margin-top: 80px; }
</style>
</head>
<body>

<nav aria-label="Menu Admin">
  <div><strong>Flashwork Admin</strong></div>
  <div>
    <a href="vagas.html" style="color:#fff;text-decoration:none;margin-right:20px">Ver Site</a>
    <button id="btn-logout" class="btn btn-danger" style="display:none;" onclick="logout()">Sair</button>
  </div>
</nav>

<main id="login-container" class="container">
  <h1>Login Administrativo</h1>
  <div class="form-group">
    <label for="user">Usuário</label>
    <input type="text" id="user" placeholder="Dica: admin">
  </div>
  <div class="form-group">
    <label for="pass">Senha</label>
    <input type="password" id="pass">
  </div>
  <button class="btn" onclick="login()">Entrar no Painel</button>
</main>

<div id="admin-content" style="display:none">
  <div class="container">
    <h2>Inserir Nova Vaga</h2>
    
    <div class="form-group">
      <label for="titulo">Título da Vaga</label>
      <input type="text" id="titulo">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
      <div class="form-group">
        <label for="area">Área</label>
        <select id="area">
          <option>TI</option>
          <option>Serviços Gerais</option>
          <option>Design</option>
          <option>Administrativo</option>
          <option>Marketing</option>
        </select>
      </div>
      <div class="form-group">
        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option>CLT</option>
          <option>Freelancer</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="empresa">Empresa</label>
      <input type="text" id="empresa">
    </div>

    <div class="form-group">
      <label for="linkVaga">Link da Vaga (URL)</label>
      <input type="url" id="linkVaga">
    </div>

    <div class="form-group">
      <label style="cursor:pointer; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="isPcd" style="width:auto;"> ♿ Vaga afirmativa / exclusiva para PcD
      </label>
    </div>

    <button class="btn" onclick="adicionarVaga()">Publicar Vaga</button>

    <hr style="margin:40px 0; border:0; border-top:1px solid #eee">

    <h2>Vagas Ativas</h2>
    <table>
      <thead>
        <tr>
          <th>Título</th>
          <th>Empresa</th>
          <th>PcD</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista-vagas-admin"></tbody>
    </table>
  </div>
</div>

<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

<script>
  let vagas = [];

  function login() {
    const user = document.getElementById('user').value;
    const pass = document.getElementById('pass').value;

    if(user === 'admin' && pass === 'w0rK') {
      sessionStorage.setItem('flashwork_admin_auth', 'true');
      checkAuth();
    } else {
      alert('Usuário ou senha incorretos!');
    }
  }

  function logout() {
    sessionStorage.removeItem('flashwork_admin_auth');
    window.location.reload();
  }

  function checkAuth() {
    if(sessionStorage.getItem('flashwork_admin_auth')) {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
      document.getElementById('btn-logout').style.display = 'inline-block';
      renderAdmin();
    }
  }

  function adicionarVaga(){
    const titulo = document.getElementById('titulo').value;
    const area = document.getElementById('area').value;
    const tipo = document.getElementById('tipo').value;
    const empresa = document.getElementById('empresa').value;
    const isPcd = document.getElementById('isPcd').checked;

    if(!titulo || !empresa){
      alert('Preencha os campos obrigatórios!');
      return;
    }

    vagas.push({ id: Date.now(), titulo, area, tipo, empresa, pcd: isPcd });
    alert('Vaga adicionada!');
    renderAdmin();
  }

  function renderAdmin(){
    const lista = document.getElementById('lista-vagas-admin');
    lista.innerHTML = '';
    vagas.forEach(v => {
      lista.innerHTML += `
        <tr>
          <td>${v.titulo}</td>
          <td>${v.empresa}</td>
          <td>${v.pcd ? 'Sim ♿' : 'Não'}</td>
          <td><button class="btn btn-danger" onclick="excluirVaga(${v.id})">Excluir</button></td>
        </tr>
      `;
    });
  }

  function excluirVaga(id){
    vagas = vagas.filter(v => v.id !== id);
    renderAdmin();
  }

  checkAuth();
</script>

</body>
</html>
